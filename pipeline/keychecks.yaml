trigger:
  batch: true

schedules:
  - cron: '0 0 * * *'  # This cron expression means "At 00:00 (midnight) every day"
    displayName: Daily midnight build
    branches:
      include:
        - develop
    always: true

variables:
  - group: aws-playwright

jobs:
- job: CleanS3
  displayName: 'Clean S3 Directories'
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: none
  - script: |
      aws s3 rm s3://playwright-results.deptlabs.uk/reports/maybourne-keychecks/ --recursive
    displayName: 'Clean S3 Directories'
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_REGION)

- job: PlaywrightTests
  displayName: Run Playwright Tests
  dependsOn: CleanS3
  pool:
    vmImage: ubuntu-latest
  container: mcr.microsoft.com/playwright:v1.49.1-jammy
  steps: 
  - checkout: self
    lfs: true
  - task: NodeTool@0
    inputs:
      versionSpec: '18'
    displayName: 'Install Node.js'

  - script: yarn install
    displayName: 'yarn install'

  - script: npx playwright install chromium
    displayName: 'Install Playwright browsers'

  - script: yarn run sitemap
    displayName: 'Run Playwright sanity'
    env:
      CI: 'true'
      SITEMAP_URL: 'https://optid.maybournegroup.com/testsitemap.xml'
    condition: succeededOrFailed()

  - script: yarn run sanity
    displayName: 'Run Playwright sanity'
    env:
      CI: 'true'
    condition: succeededOrFailed()

  - task: PublishTestResults@2
    displayName: 'Publish test results sanity'
    inputs:
      searchFolder: 'test-results'
      testResultsFormat: 'JUnit'
      testResultsFiles: 'e2e-junit-*.xml'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: 'Sanity tests'
    condition: succeededOrFailed()

  # - script: yarn run a11y-sitemap
